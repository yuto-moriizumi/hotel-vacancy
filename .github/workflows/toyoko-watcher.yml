name: toyoko-watcher

# 東横イン空室監視（1周/実行）。負荷配慮のため 60分間隔・同時実行は1に制限。
on:
  schedule:
    - cron: "17 * * * *" # 毎時17分（混雑時刻を避けるため任意のオフセット）
  workflow_dispatch:

concurrency:
  group: toyoko-watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run watcher (1 pass)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOYOKO_TO: ${{ secrets.TOYOKO_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          TOYOKO_STOP_AFTER_NOTIFY: ${{ vars.TOYOKO_STOP_AFTER_NOTIFY }}
          TOYOKO_DELAY_MIN_MS: ${{ vars.TOYOKO_DELAY_MIN_MS }}
          TOYOKO_DELAY_MAX_MS: ${{ vars.TOYOKO_DELAY_MAX_MS }}
          TOYOKO_MAX_FAILURES: ${{ vars.TOYOKO_MAX_FAILURES }}
          TOYOKO_REFIRE_MIN: ${{ vars.TOYOKO_REFIRE_MIN }}
        run: node src/watcher/cli.mts run
